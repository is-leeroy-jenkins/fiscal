[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiscal-pi"
version = "0.1.1"
description = "U.S. federal fiscal-year, holiday, workday, and FTE calculations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Terry D. Eppler" },
]
dependencies = [
    "pandas>=2.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocs-autorefs>=1.4",
    "mkdocstrings[python]>=0.30",
    "pymdown-extensions>=10.16",
]
dev = [
    "black>=25.0",
    "build>=1.2",
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocs-autorefs>=1.4",
    "mkdocstrings[python]>=0.30",
    "pymdown-extensions>=10.16",
    "pytest>=8.0",
]

[project.urls]
Documentation = "https://is-leeroy-jenkins.github.io/fiscal/"
Repository = "https://github.com/is-leeroy-jenkins/fiscal"
Issues = "https://github.com/is-leeroy-jenkins/fiscal/issues"

[tool.setuptools]
packages = ["fiscal", "fiscal.sqlite"]
include-package-data = true

[tool.setuptools.package-data]
"fiscal.sqlite" = ["data.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
